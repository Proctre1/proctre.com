<!doctype html>
<!-- Source for og-image.png (the 1200x630 share card). Not published: GitHub Pages skips folders starting with "_".
     Rebuild with headless Edge, e.g.:
     msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 --screenshot=og-image.png _og/card.html
     Then raise the ?v= number on the og:image and twitter:image lines in index.html so apps fetch the new picture.
     To show a brand, add or remove its <div class="b"> block below. Colours match style.css. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c1a26;color:#f4efe4;font-family:"Archivo","Arial Black",sans-serif}
.card{display:grid;grid-template-rows:1fr 150px;height:630px}
.top{padding:50px 64px 0;display:grid;grid-template-rows:auto 1fr;gap:34px}
.wide{font-stretch:125%;font-weight:800;text-transform:uppercase}
.mark{font-size:34px;letter-spacing:.1em;color:#ff7a1a}
h1{margin:0;font-size:86px;line-height:1;letter-spacing:-.01em}
h1 mark{background:#ff7a1a;color:#0c1a26;padding:0 .12em}
.brands{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.b{background:var(--c);color:#0c1a26;padding:34px 40px 0;display:grid;align-content:start;gap:12px}
.b small{font:700 16px/1 "Archivo",sans-serif;font-stretch:110%;letter-spacing:.14em;text-transform:uppercase}
.b div{font-size:32px;line-height:1.02}
</style></head><body><div class="card">
<div class="top">
  <div class="mark wide">Proctre</div>
  <h1 class="wide">The good guys,<br>working on<br><mark>your side.</mark></h1>
</div>
<div class="brands">
  <div class="b" style="--c:#a592ff"><small>Online now</small><div class="wide">Compositr</div></div>
  <div class="b" style="--c:#3fd68a"><small>On standby</small><div class="wide">Working Dollars</div></div>
  <div class="b" style="--c:#4cc8e6"><small>In development</small><div class="wide">Proctre Ledger</div></div>
</div>
</div></body></html>
